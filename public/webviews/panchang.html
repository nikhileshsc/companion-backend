<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Today's Panchang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#FC427B; --secondary:#161B27; --title:#252525; --desc:#818181; --desc1:#636363;
    --bg:#FFFFFF; --bg-report:#F7F7F7; --light-pink:#FFECF2; --filter-bg:#FFF8FA;
    --border:#EEEEEE; --shadow:0 4px 14px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg-report); font-family:'Open Sans',sans-serif; }

  .h-hero{ text-align:center; padding:22px 16px 4px; background:var(--bg); border-bottom:1px solid var(--border); }
  .h-sign-badge{
    width:64px;height:64px; border-radius:50%;
    background:linear-gradient(135deg,#FC427B,#FF8FB3);
    display:flex;align-items:center;justify-content:center; font-size:30px;
    margin:0 auto 10px; box-shadow:0 8px 20px rgba(252,66,123,0.28);
  }
  .h-hero h1{ font-family:'Poppins',sans-serif; font-weight:700; font-size:19px; color:var(--title); margin:0 0 4px; }
  .h-hero .hdate{ font-size:11.5px; color:var(--desc); }
  .free-pill-dark{
    display:inline-flex; align-items:center; gap:5px; background:var(--light-pink); color:var(--primary);
    font-family:'Poppins',sans-serif; font-weight:700; font-size:9px; letter-spacing:0.04em;
    padding:4px 10px; border-radius:20px; margin-top:8px;
  }

  .h-section{ padding:16px; }
  .h-card{ background:var(--bg); border-radius:12px; box-shadow:var(--shadow); padding:15px; margin-bottom:12px; }
  .h-card.featured{ background:var(--filter-bg); border:1px solid #FFD6E4; }
  .h-card-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .h-icon{ width:26px;height:26px; border-radius:8px; background:var(--light-pink); display:flex;align-items:center;justify-content:center; font-size:13px; }
  .h-card-title{ font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px; color:var(--title); }
  .h-card-text{ font-size:12px; color:var(--desc1); line-height:1.65; margin:0; white-space:pre-line; }

  .secondary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mini-card{ background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px; }
  .mini-card .h-card-title{ font-size:11.5px; margin-bottom:5px;}
  .mini-card .h-card-text{ font-size:10.5px; }

  .footnote{ padding:4px 20px 32px; text-align:center; }
  .footnote p{ font-size:10px; color:var(--desc); line-height:1.6; margin:0; }

  .state{ padding:60px 20px; text-align:center; color:var(--desc); font-size:13px; }
  .state.error{ color:#E74C3C; }
</style>
</head>
<body>

<div id="app">
  <div class="state" id="loading">Loading today's Panchang…</div>
</div>

<script>
  function qs(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function pick(obj, keys) {
    if (!obj) return null;
    for (const k of keys) {
      if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
    }
    return null;
  }

  async function loadPanchang() {
    const token = qs('token');
    const app = document.getElementById('app');

    if (!token) {
      app.innerHTML = '<div class="state error">Missing auth token.</div>';
      return;
    }

    try {
      const res = await fetch('/api/app/v1/user/getDailyPanchang', {
        method: 'GET',
        headers: { 'Authorization': token, 'Content-Type': 'application/json' },
      });
      const json = await res.json();
      if (!res.ok || !json.data) {
        throw new Error(json.message || 'Could not load Panchang.');
      }
      render(json.data);
    } catch (err) {
      app.innerHTML = '<div class="state error">' + (err.message || 'Something went wrong.') + '</div>';
    }
  }

  function render(data) {
    const dateStr = new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    // DivineAPI's exact field names/nesting can vary slightly; read defensively
    // rather than assume one fixed shape.
    const tithi = pick(data.tithi, ['name']) || (typeof data.tithi === 'string' ? data.tithi : null);
    const nakshatra = pick(data.nakshatra, ['name']) || (typeof data.nakshatra === 'string' ? data.nakshatra : null);
    const yoga = pick(data.yoga, ['name']) || (typeof data.yoga === 'string' ? data.yoga : null);
    const karana = pick(data.karana, ['name']) || (typeof data.karana === 'string' ? data.karana : null);
    const sunrise = pick(data, ['sunrise']);
    const sunset = pick(data, ['sunset']);
    const vaar = pick(data, ['vaar', 'day_name', 'weekday']);

    let html = '';
    html += '<div class="h-hero">';
    html += '  <div class="h-sign-badge">🕉️</div>';
    html += '  <h1>' + (vaar ? vaar : "Today's Panchang") + '</h1>';
    html += '  <div class="hdate">' + dateStr + '</div>';
    html += '  <div class="free-pill-dark">✦ FREE — UPDATED DAILY</div>';
    html += '</div>';
    html += '<div class="h-section">';

    if (tithi || nakshatra) {
      html += '  <div class="h-card featured">';
      html += '    <div class="h-card-head"><div class="h-icon">🌙</div><div class="h-card-title">Tithi &amp; Nakshatra</div></div>';
      if (tithi) html += '    <p class="h-card-text"><b>Tithi:</b> ' + tithi + '</p>';
      if (nakshatra) html += '    <p class="h-card-text"><b>Nakshatra:</b> ' + nakshatra + '</p>';
      html += '  </div>';
    }

    if (yoga || karana) {
      html += '  <div class="secondary-grid">';
      html += '    <div class="mini-card"><div class="h-card-title">Yoga</div><p class="h-card-text">' + (yoga || '—') + '</p></div>';
      html += '    <div class="mini-card"><div class="h-card-title">Karana</div><p class="h-card-text">' + (karana || '—') + '</p></div>';
      html += '  </div>';
    }

    if (sunrise || sunset) {
      html += '  <div class="h-card" style="margin-top:12px;">';
      html += '    <div class="h-card-head"><div class="h-icon">☀️</div><div class="h-card-title">Sunrise &amp; Sunset</div></div>';
      html += '    <div class="secondary-grid">';
      html += '      <div class="mini-card"><div class="h-card-title">Sunrise</div><p class="h-card-text">' + (sunrise || '—') + '</p></div>';
      html += '      <div class="mini-card"><div class="h-card-title">Sunset</div><p class="h-card-text">' + (sunset || '—') + '</p></div>';
      html += '    </div>';
      html += '  </div>';
    }

    if (!tithi && !nakshatra && !yoga && !karana && !sunrise && !sunset) {
      html += '  <div class="h-card"><p class="h-card-text">Panchang data is being prepared — check back shortly.</p></div>';
    }

    html += '</div>';
    html += '<div class="footnote"><p>Based on your city, fresh every day.<br/>Powered by DivineAPI.</p></div>';

    document.getElementById('app').innerHTML = html;
  }

  loadPanchang();
</script>
</body>
</html>
